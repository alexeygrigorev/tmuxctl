[project]
name = "tmuxctl"
version = "0.3.4"
description = "Small tmux session controller with recurring sends"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Alexey Grigorev" },
]
keywords = ["tmux", "cli", "scheduler", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Shells",
  "Topic :: Utilities",
]
dependencies = [
  "click>=8,<9",
  "typer>=0.12,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
tmuxctl = "tmuxctl.cli:main"
t = "tmuxctl.cli:main"

[project.urls]
Homepage = "https://github.com/alexeygrigorev/tmuxctl"
Issues = "https://github.com/alexeygrigorev/tmuxctl/issues"

[dependency-groups]
dev = [
  "hatch>=1,<2",
  "pytest>=8,<9",
]

[tool.tmuxctl]
# Per-session MemoryMax cap for tmux sessions created in this repo (cgroup v2).
# Non-Python repos can use a dedicated cgroups.toml with a top-level `mem` key
# instead; it wins over this section when both are present.
mem = "12G"
swap = "8G"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["tmuxctl*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
