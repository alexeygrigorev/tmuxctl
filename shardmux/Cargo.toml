[package]
name = "shardmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Failure-isolated terminal sessions"
repository = "https://github.com/alexeygrigorev/tmuxctl"
readme = "README.md"
keywords = ["terminal", "multiplexer", "pty", "systemd", "oom"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
fs2 = "0.4"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
uuid = { version = "1.25", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.20"
